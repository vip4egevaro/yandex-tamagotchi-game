<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Тамагочи - Реальная Игра</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 500px; background: #16213e; border: 3px solid #0f3460; border-radius: 20px; padding: 20px; box-shadow: 0 0 30px rgba(15, 52, 96, 0.8); }
        .game-title { text-align: center; font-size: 24px; margin-bottom: 20px; color: #e94560; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Экран выбора */
        .select-screen h2 { text-align: center; margin-bottom: 20px; }
        .character-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .char-btn { background: #0f3460; border: 2px solid #e94560; padding: 20px; border-radius: 10px; cursor: pointer; text-align: center; transition: all 0.3s; color: #fff; font-size: 40px; }
        .char-btn:hover { background: #e94560; transform: scale(1.05); }
        
        /* Основная игра */
        .pet-name { text-align: center; font-size: 28px; color: #00d4ff; margin-bottom: 15px; }
        .pet-display { text-align: center; background: linear-gradient(135deg, #0f3460 0%, #16213e 100%); padding: 30px; border-radius: 15px; margin: 20px 0; border: 2px solid #00d4ff; }
        .pet-emoji { font-size: 120px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .stat { background: #0f3460; padding: 15px; border-radius: 10px; border-left: 4px solid #00d4ff; }
        .stat-name { font-size: 12px; color: #888; margin-bottom: 8px; }
        .stat-bar { width: 100%; height: 20px; background: #1a1a2e; border-radius: 10px; overflow: hidden; border: 1px solid #00d4ff; }
        .stat-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #00ff88); transition: width 0.3s; }
        .stat-value { font-size: 14px; color: #00ff88; margin-top: 5px; }
        
        .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 0; }
        .action-btn { background: #0f3460; border: 2px solid #00d4ff; color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: bold; }
        .action-btn:hover:not(:disabled) { background: #00d4ff; color: #16213e; }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .info { background: #0f3460; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #00ff88; }
        .info-title { color: #00ff88; font-weight: bold; margin-bottom: 8px; }
        .info-text { font-size: 12px; color: #aaa; line-height: 1.6; }
        
        .time { text-align: center; color: #888; font-size: 12px; margin-top: 10px; }
        
        .back-btn { background: #e94560; border: none; color: #fff; padding: 10px 15px; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; }
        .back-btn:hover { background: #ff6b7a; }
        
        .warning { color: #ff6b6b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-title">🐾 ТАМАГОЧИ 2024 🐾</div>
        
        <!-- Экран выбора персонажа -->
        <div id="selectScreen" class="screen active">
            <h2>Выберите питомца:</h2>
            <div class="character-options">
                <button class="char-btn" onclick="startGame('🐱', 'Кот')">🐱</button>
                <button class="char-btn" onclick="startGame('🐕', 'Собака')">🐕</button>
                <button class="char-btn" onclick="startGame('🐰', 'Кролик')">🐰</button>
                <button class="char-btn" onclick="startGame('🐦', 'Птица')">🐦</button>
            </div>
        </div>
        
        <!-- Игровой экран -->
        <div id="gameScreen" class="screen">
            <div class="pet-name" id="petName">Мой питомец</div>
            
            <div class="pet-display">
                <div class="pet-emoji" id="petEmoji">🐱</div>
                <div id="petStatus" style="font-size: 14px; margin-top: 10px; color: #00d4ff;"></div>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-name">ГОЛОД</div>
                    <div class="stat-bar"><div id="hungerFill" class="stat-fill" style="width: 100%;"></div></div>
                    <div class="stat-value" id="hungerText">100/100</div>
                </div>
                <div class="stat">
                    <div class="stat-name">СЧАСТЬЕ</div>
                    <div class="stat-bar"><div id="happyFill" class="stat-fill" style="width: 100%;"></div></div>
                    <div class="stat-value" id="happyText">100/100</div>
                </div>
                <div class="stat">
                    <div class="stat-name">ЭНЕРГИЯ</div>
                    <div class="stat-bar"><div id="energyFill" class="stat-fill" style="width: 100%;"></div></div>
                    <div class="stat-value" id="energyText">100/100</div>
                </div>
                <div class="stat">
                    <div class="stat-name">ЗДОРОВЬЕ</div>
                    <div class="stat-bar"><div id="healthFill" class="stat-fill" style="width: 100%;"></div></div>
                    <div class="stat-value" id="healthText">100/100</div>
                </div>
            </div>
            
            <div class="actions">
                <button class="action-btn" onclick="feed()">🍽️ КОРМИТЬ</button>
                <button class="action-btn" onclick="play()">🎮 ИГРАТЬ</button>
                <button class="action-btn" onclick="sleep()">😴 СПАТЬ</button>
                <button class="action-btn" onclick="cure()">💊 ЛЕЧИТЬ</button>
            </div>
            
            <div class="info">
                <div class="info-title" id="eventTitle">📝 ИНФОРМАЦИЯ</div>
                <div class="info-text" id="eventText">Твой питомец готов к приключениям!</div>
            </div>
            
            <div class="time" id="timeDisplay">Время игры: 0:00</div>
            
            <button class="back-btn" onclick="backToSelect()">← ВЫБРАТЬ ДРУГОГО</button>
        </div>
    </div>

    <script>
        let pet = null;
        let gameRunning = false;
        let startTime = 0;
        
        const petStats = {
            hunger: 100,
            happiness: 100,
            energy: 100,
            health: 100,
            isSleeping: false,
            lastAction: 'normal',
            actionTime: 0
        };
        
        function startGame(emoji, name) {
            pet = { emoji, name };
            petStats.hunger = 100;
            petStats.happiness = 100;
            petStats.energy = 100;
            petStats.health = 100;
            petStats.isSleeping = false;
            gameRunning = true;
            startTime = Date.now();
            
            document.getElementById('selectScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('petName').textContent = name;
            document.getElementById('petEmoji').textContent = emoji;
            
            updateUI();
            gameLoop();
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // Основные изменения статов (каждую секунду)
            const now = Date.now();
            
            if (petStats.isSleeping) {
                petStats.energy = Math.min(100, petStats.energy + 1.5);
                petStats.hunger = Math.max(0, petStats.hunger - 0.3);
                if (petStats.energy >= 100) {
                    petStats.isSleeping = false;
                    showEvent('СООБЩЕНИЕ', '☀️ Питомец проснулся!');
                }
            } else {
                // Голод растет
                petStats.hunger = Math.max(0, petStats.hunger - 0.8);
                // Счастье снижается
                petStats.happiness = Math.max(0, petStats.happiness - 0.5);
                // Энергия снижается
                petStats.energy = Math.max(0, petStats.energy - 0.6);
            }
            
            // Здоровье зависит от голода и счастья
            if (petStats.hunger < 20) {
                petStats.health = Math.max(0, petStats.health - 1);
            } else if (petStats.happiness < 20) {
                petStats.health = Math.max(0, petStats.health - 0.5);
            } else {
                petStats.health = Math.min(100, petStats.health + 0.1);
            }
            
            // Случайные события
            if (Math.random() < 0.01 && petStats.hunger < 30) {
                showEvent('⚠️ ГОЛОД', '😫 Питомец сильно голоден! Накорми его!');
            }
            if (Math.random() < 0.008 && petStats.happiness < 20) {
                showEvent('⚠️ ГРУСТЬ', '😢 Питомец грустит. Поиграй с ним!');
            }
            if (Math.random() < 0.005 && petStats.health < 30) {
                showEvent('🚨 БОЛЕЗНЬ', '🤒 Питомец заболел! Используй лечение!');
            }
            
            updateUI();
            updateTime();
            
            // Проверка смерти
            if (petStats.health <= 0) {
                gameRunning = false;
                showEvent('💀 КОНЕЦ ИГРЫ', 'Питомец умер... Игра окончена!');
                document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);
                return;
            }
            
            setTimeout(gameLoop, 100);
        }
        
        function feed() {
            if (petStats.isSleeping) {
                showEvent('💤', 'Питомец спит, не трогай его!');
                return;
            }
            if (petStats.hunger >= 90) {
                showEvent('😒', 'Питомец не голоден!');
                return;
            }
            
            petStats.hunger = Math.min(100, petStats.hunger + 40);
            petStats.happiness = Math.max(0, petStats.happiness - 5);
            showEvent('😋 КОРМЛЕНИЕ', 'Питомец с аппетитом ест!');
        }
        
        function play() {
            if (petStats.isSleeping) {
                showEvent('💤', 'Питомец спит!');
                return;
            }
            if (petStats.energy < 30) {
                showEvent('😴', 'Питомец слишком устал для игры!');
                return;
            }
            
            petStats.happiness = Math.min(100, petStats.happiness + 35);
            petStats.energy = Math.max(0, petStats.energy - 40);
            petStats.hunger = Math.max(0, petStats.hunger - 20);
            showEvent('🎮 ИГРА', 'Вау! Питомец весело играет! 😄');
        }
        
        function sleep() {
            if (petStats.isSleeping) {
                showEvent('💤', 'Питомец уже спит!');
                return;
            }
            
            petStats.isSleeping = true;
            showEvent('😴 СОН', 'Питомец уснул... Zzz...');
        }
        
        function cure() {
            if (petStats.isSleeping) {
                showEvent('💤', 'Питомец спит!');
                return;
            }
            if (petStats.health >= 80) {
                showEvent('✅', 'Питомец здоров!');
                return;
            }
            
            petStats.health = Math.min(100, petStats.health + 50);
            petStats.happiness = Math.max(0, petStats.happiness - 10);
            showEvent('💊 ЛЕЧЕНИЕ', 'Питомец получил лекарство!');
        }
        
        function updateUI() {
            // Обновляем полоски и текст
            updateStat('hunger', petStats.hunger);
            updateStat('happy', petStats.happiness);
            updateStat('energy', petStats.energy);
            updateStat('health', petStats.health);
            
            // Статус питомца
            let status = '';
            if (petStats.isSleeping) status = '💤 Спит';
            else if (petStats.hunger < 20) status = '😫 Голоден!';
            else if (petStats.happiness < 20) status = '😢 Грустит';
            else if (petStats.health < 30) status = '🤒 Болен';
            else status = '😊 Счастлив';
            
            document.getElementById('petStatus').textContent = status;
        }
        
        function updateStat(name, value) {
            const fill = document.getElementById(name + 'Fill');
            const text = document.getElementById(name + 'Text');
            fill.style.width = value + '%';
            text.textContent = Math.floor(value) + '/100';
        }
        
        function updateTime() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timeDisplay').textContent = 
                `Время игры: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }
        
        function showEvent(title, text) {
            document.getElementById('eventTitle').textContent = title;
            document.getElementById('eventText').textContent = text;
        }
        
        function backToSelect() {
            gameRunning = false;
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('selectScreen').classList.add('active');
        }
    </script>
</body>
</html>
